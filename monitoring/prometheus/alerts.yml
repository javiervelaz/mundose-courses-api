groups:
  - name: mundose-api
    rules:
      - alert: ApiCaida
        expr: up{job="mundose-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "La API no responde al scrape de Prometheus"

      - alert: TasaDeErrores5xxAlta
        expr: |
          sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Más del 5 % de las respuestas son 5xx"

      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "La latencia p95 supera 500 ms"
