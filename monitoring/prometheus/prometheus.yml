# Prometheus — mismo archivo para AWS y local (los nombres de servicio coinciden).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: mundose

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mundose-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
