# ---------------------------------------------------------------------------
# Pipeline CI/CD — mundose-courses-api
#
#   quality ─┬─ sonar
#            │
#   security ┼─ (deps + IaC con Snyk, Terraform fmt/validate)
#            │
#            └─► build ─► (Snyk container, SBOM CycloneDX + SPDX, push GHCR) ─► deploy (Terraform AWS)
#
# - Pull requests a main: corre todo menos el push de la imagen y el deploy.
# - Push a main: además publica la imagen (tag = SHA) y despliega con Terraform.
# - Cualquier job en rojo corta el flujo: no hay deploy sin todos los controles en verde.
# ---------------------------------------------------------------------------
name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  TF_VERSION: "1.17.0"
  SNYK_VERSION: "1.1308.3"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mundose-courses-api
  IS_RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  # ------------------------------------------------------------------ calidad
  quality:
    name: quality · lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: |
          mkdir -p reports
          npx eslint . --format json --output-file reports/eslint.json || true
          npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests + cobertura (umbral 80 %)
        run: npm run test:coverage

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: quality-reports
          path: |
            coverage/lcov.info
            reports/eslint.json
          retention-days: 30

  sonar:
    name: quality · SonarQube Cloud
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Diagnóstico de secrets
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for n in SNYK_TOKEN SONAR_TOKEN; do
            v="${!n}"
            if [ -n "$v" ]; then echo "$n: presente (${#v} caracteres)"; else echo "$n: VACÍO"; fi
          done

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Sonar necesita el historial para calcular "new code"

      - uses: actions/download-artifact@v8.0.2
        with:
          name: quality-reports

      - name: Análisis + quality gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------- seguridad
  security:
    name: security · Snyk deps + IaC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # subir SARIF a la pestaña Security
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Diagnóstico de secrets
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for n in SNYK_TOKEN SONAR_TOKEN; do
            v="${!n}"
            if [ -n "$v" ]; then echo "$n: presente (${#v} caracteres)"; else echo "$n: VACÍO"; fi
          done

      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Instalar Snyk CLI
        run: npm install -g snyk@${{ env.SNYK_VERSION }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/envs/aws infra/envs/local; do
            echo "::group::validate $dir"
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done

      - name: Snyk — dependencias npm (bloquea con severidad high)
        run: |
          mkdir -p reports
          snyk test --severity-threshold=high \
            --json-file-output=reports/snyk-deps.json \
            --sarif-file-output=reports/snyk-deps.sarif

      - name: Snyk — Terraform (IaC)
        if: always()
        run: |
          snyk iac test infra --severity-threshold=high \
            --json-file-output=reports/snyk-iac.json \
            --sarif-file-output=reports/snyk-iac.sarif

      - uses: github/codeql-action/upload-sarif@v4.39.1
        if: always() && hashFiles('reports/snyk-deps.sarif') != ''
        with:
          sarif_file: reports/snyk-deps.sarif
          category: snyk-deps

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: security-reports
          path: reports/
          retention-days: 90

  # ------------------------------------------------------- build + imagen + SBOM
  build:
    name: build · imagen, Snyk container, SBOM
    runs-on: ubuntu-latest
    needs: [quality, security]
    permissions:
      contents: read
      packages: write # push a GHCR
      id-token: write # firma keyless de la atestación
      attestations: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Referencias de la imagen
        id: ref
        run: |
          image=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          version=$(node -p "require('./package.json').version")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build (carga local para escanear antes de publicar)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}
            ${{ steps.ref.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.ref.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.ref.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor
        run: |
          docker run -d --name smoke -p 8080:8080 ${{ steps.ref.outputs.image }}:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "${{ github.sha }}"
          test "$(docker inspect -f '{{.Config.User}}' smoke)" = "node"
          docker rm -f smoke

      - name: Instalar Snyk CLI
        run: npm install -g snyk@${{ env.SNYK_VERSION }}

      - name: Snyk — imagen (bloquea con severidad high)
        run: |
          mkdir -p reports
          snyk container test ${{ steps.ref.outputs.image }}:${{ github.sha }} \
            --file=Dockerfile --severity-threshold=high \
            --json-file-output=reports/snyk-container.json

      - name: SBOM CycloneDX (imagen)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.ref.outputs.image }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: reports/sbom.cyclonedx.json
          upload-artifact: false

      - name: SBOM SPDX (imagen)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.ref.outputs.image }}:${{ github.sha }}
          format: spdx-json
          output-file: reports/sbom.spdx.json
          upload-artifact: false

      - name: Exportar imagen (artefacto del entregable)
        if: env.IS_RELEASE == 'true'
        run: docker save ${{ steps.ref.outputs.image }}:${{ github.sha }} | gzip > reports/mundose-courses-api_${{ github.sha }}.tar.gz

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: build-artifacts
          path: reports/
          retention-days: 90

      - name: Login a GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push a GHCR
        id: push
        if: env.IS_RELEASE == 'true'
        run: |
          docker push --all-tags ${{ steps.ref.outputs.image }}
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' ${{ steps.ref.outputs.image }}:${{ github.sha }} | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.ref.outputs.image }}:${{ github.sha }}\` — \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Atestación de procedencia (SLSA)
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ------------------------------------------------------------------- deploy
  deploy:
    name: deploy · Terraform AWS
    runs-on: ubuntu-latest
    needs: [build, sonar]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: ${{ steps.out.outputs.app_url }}
    permissions:
      contents: read
      id-token: write # OIDC: sin access keys guardadas
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/envs/aws
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_image: ${{ needs.build.outputs.image }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (estado remoto en S3)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=mundose/aws.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false tfplan

      - name: Outputs
        id: out
        run: |
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
          echo "grafana_url=$(terraform output -raw grafana_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test en AWS (hasta 6 min por el reemplazo de la instancia)
        run: |
          url="${{ steps.out.outputs.app_url }}"
          for i in $(seq 1 36); do
            if body=$(curl -fsS --max-time 5 "$url/"); then
              echo "$body"
              echo "$body" | grep -q "${{ github.sha }}" && exit 0
            fi
            echo "intento $i/36: todavía no responde la versión nueva"; sleep 10
          done
          echo "::error::La versión ${{ github.sha }} no quedó en línea"; exit 1

      - name: Resumen
        run: |
          {
            echo "### Deploy en AWS"
            echo "| | |"
            echo "|---|---|"
            echo "| App | ${{ steps.out.outputs.app_url }} |"
            echo "| Grafana | ${{ steps.out.outputs.grafana_url }} (solo ADMIN_CIDR) |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Imagen | \`${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
